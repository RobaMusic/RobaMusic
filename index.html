<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RobaMusic</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="./assets/favicon.png">
</head>
<body>

    <div class="game-container" id="splashScreen">
        <div class="logo">
            <img src="./assets/roba_music_logo.png" alt="RobaMusic Logo">
        </div>
        <button class="spotify-connect-button" id="spotifyConnectBtn">
            <img src="./assets/spotify_icon.png" alt="Spotify Icon"> SPOTIFY CSATLAKOZTATÁSA
        </button>
        <p class="spotify-status" id="spotifyStatus">Spotify nincs csatlakoztatva</p>
        <button class="start-game-button" id="startGameBtn" disabled>
            <img src="./assets/play_icon.png" alt="Play Icon"> JÁTÉK INDÍTÁSA
        </button>
    </div>

    <!-- MAIN MENU SCREEN -->
    <div class="game-container hidden" id="mainMenuScreen">
        <div class="logo">
            <img src="./assets/roba_music_logo.png" alt="RobaMusic Logo">
        </div>
        <h2 class="screen-title">Játéktípus kiválasztása</h2>

        <button class="menu-button" id="qrScanBtn">
            QR-kód olvasás <br> <span class="subtitle">(Van saját kódcsomagod)</span>
        </button>
        <button class="menu-button" id="phoneGameBtn">
            Telefonos játék <br> <span class="subtitle">(QR-kód olvasás nélkül)</span>
        </button>
        <button class="menu-button" id="resultsBtn">
            Eredmények
        </button>
    </div>
    <!-- END MAIN MENU SCREEN -->

    <!-- SETTINGS SCREEN -->
    <div class="game-container hidden" id="settingsScreen">
        <div class="logo">
            <img src="./assets/roba_music_logo.png" alt="RobaMusic Logo">
        </div>
        <h2 class="screen-title">Beállítások</h2>

        <!-- Zenehallgatás időtartama -->
        <h3 class="setting-category">Zenehallgatás időtartama</h3>
        <button class="setting-option-button selected" data-setting="listeningTime" data-value="45">45 mp</button>
        <button class="setting-option-button" data-setting="listeningTime" data-value="90">90 mp</button>
        <button class="setting-option-button" data-setting="listeningTime" data-value="full">Teljes dal</button>

        <!-- Zenestílus kiválasztása -->
        <h3 class="setting-category">Zenestílus kiválasztása</h3>
        <button class="setting-option-button selected" data-setting="musicStyle" data-value="POP">POP</button>
        <button class="setting-option-button" data-setting="musicStyle" data-value="ROCK">ROCK</button>
        <button class="setting-option-button" data-setting="musicStyle" data-value="HU">MAGYAR ZENE</button>
        <button class="setting-option-button" data-setting="musicStyle" data-value="MOV">FILMZENE</button>
        <button class="setting-option-button" data-setting="musicStyle" data-value="XMAS">KARÁCSONYI</button>
        <button class="setting-option-button" data-setting="musicStyle" data-value="ALL">ÖSSZES KATEGÓRIA</button>


        <!-- Zeneszámok mennyisége -->
        <h3 class="setting-category">Zeneszámok mennyisége</h3>
        <button class="setting-option-button selected" data-setting="songCount" data-value="50">50 db</button>
        <button class="setting-option-button" data-setting="songCount" data-value="100">100 db</button>
        <button class="setting-option-button" data-setting="songCount" data-value="300">300 db</button>
        <button class="setting-option-button" data-setting="songCount" data-value="all">Összes adatbázis</button>

        <button class="start-game-button" id="startPhoneGameBtn">Játék kezdése</button>
        <button class="back-to-main-menu-button" id="backToMainMenuFromSettings">Vissza a Főmenübe</button>
    </div>
    <!-- END SETTINGS SCREEN -->

    <!-- GAME SCREEN -->
    <div class="game-container hidden" id="gameScreen">
        <div class="logo">
            <img src="./assets/roba_music_logo.png" alt="RobaMusic Logo">
        </div>

        <!-- Dal adatai, kezdetben rejtve -->
        <div class="song-info-display">
            <p id="displayArtist" class="revealed-info">Előadó: ???</p>
            <p id="displayTitle" class="revealed-info">Dal címe: ???</p>
            <p id="displayYear" class="revealed-info">Megjelenés éve: ????</p>
        </div>

        <!-- Spotify lejátszó iframe -->
        <div class="spotify-player-container">
            <!-- Ide fog bekerülni a Spotify lejátszó iframe a JS segítségével -->
            <div id="spotifyPlayerPlaceholder" class="spotify-player-placeholder">
                Spotify lejátszó töltődik...
            </div>
            <p class="spotify-note">A zene a Spotify-ról töltődik be.</p>
        </div>

        <!-- Játék vezérlők -->
        <div class="game-controls">
            <!-- Játékos vezérlők (Play/Pause) - Ezeket valójában az iframe tartalmazza -->
            <button class="game-control-button" id="playMusicBtn" disabled>
                <img src="./assets/play_icon.png" alt="Play Icon"> Zene lejátszása
            </button>
            <button class="game-control-button" id="pauseMusicBtn" disabled>
                <img src="./assets/pause_icon.png" alt="Pause Icon"> Zene leállítása
            </button>
            <!-- Megjegyzés: A pause ikonhoz szükségünk lesz egy pause_icon.png-re az assets mappában -->

            <!-- Maradék idő csúszka (MOCK) -->
            <label for="yearGuess" class="year-label">Hallgatási idő:</label>
            <input type="range" id="remainingTimeSlider" min="0" max="100" value="100" disabled>
            <p id="timeRemainingText">00:45</p>

            <label for="yearGuess" class="year-label">Melyik évben jelent meg a dal?</label>
            <input type="number" id="yearGuess" placeholder="Írd be az évet (pl. 1990)" min="1900" max="2025">

            <button class="action-button" id="checkAnswerBtn">Válasz ellenőrzése</button>
        </div>

        <button class="back-to-main-menu-button" id="backToMainMenuFromGame">Visszatérés a Főmenübe</button>
    </div>
    <!-- END GAME SCREEN -->

    <script src="script.js"></script>
</body>
</html>
