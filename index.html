<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Játék - Beállítások és Indítás</title>
    <!-- Ide jön majd a CSS fájl(ok) linkje -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="app-container">
        <!-- Kezdőlap / Beállítások / Eredmények oldal -->
        <section id="home-settings-screen" class="screen active">
            <h1>Játék Indítása és Beállítások</h1>

            <div class="settings-group">
                <h2>Játék beállítások</h2>
                <label for="difficulty-select">Nehézség:</label>
                <select id="difficulty-select">
                    <option value="easy">Könnyű</option>
                    <option value="medium">Közepes</option>
                    <option value="hard">Nehéz</option>
                </select>
                
                <label for="timer-checkbox">Időkorlát:</label>
                <input type="checkbox" id="timer-checkbox">
                
                <label for="sound-checkbox">Hanghatások:</label>
                <input type="checkbox" id="sound-checkbox" checked>
            </div>

            <button id="start-game-button">Játék indítása</button>

            <div id="last-game-results" style="display: none;">
                <h2>Utolsó játék eredménye:</h2>
                <p>Pontszám: <span id="result-score">0</span></p>
                <p>Idő: <span id="result-time">0s</span></p>
                <p>Megjegyzés: <span id="result-message"></span></p>
            </div>
        </section>

        <!-- Játék képernyő -->
        <section id="game-screen" class="screen">
            <h1>A Játék Folyamatban...</h1>
            <div id="game-area">
                <!-- Ide kerül majd a memóriajáték vagy quiz elemei -->
                <p>Készülj fel, hamarosan indul a játék!</p>
                <div id="game-info">
                    <span id="current-score">Pont: 0</span> | 
                    <span id="current-timer">Idő: --:--</span>
                </div>
                <div id="game-content">
                    <!-- Itt lesznek a kártyák, kérdések stb. -->
                </div>
            </div>
            <button id="end-game-button" style="display: none;">Játék befejezése</button>
        </section>

    </div>

    <!-- Ide jön majd a JavaScript fájl(ok) linkje -->
    <script src="script.js"></script>
</body>
</html>
