<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RobaMusic</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="./assets/favicon.png"> <!-- A favicon továbbra is külön fájl, ha van -->
</head>
<body>

    <div class="game-container" id="splashScreen">
        <div class="logo">
            <!-- Az általad küldött logóképet használjuk, ami tartalmazza a szövegeket -->
            <img src="./assets/roba_music_logo.png" alt="RobaMusic Logo">
            <!-- A korábbi h1 és h2 tagekre már nincs szükség, ha a logó tartalmazza a szöveget -->
        </div>
        <button class="spotify-connect-button" id="spotifyConnectBtn">
            <img src="./assets/spotify_icon.png" alt="Spotify Icon"> SPOTIFY CSATLAKOZTATÁSA
        </button>
        <p class="spotify-status" id="spotifyStatus">Spotify nincs csatlakoztatva</p>
        <button class="start-game-button" id="startGameBtn" disabled>
            <img src="./assets/play_icon.png" alt="Play Icon"> JÁTÉK INDÍTÁSA
        </button>
    </div>

    <!-- Ide jönnek majd a többi képernyő (Main Menu, QR Scan, etc.) -->

    <script src="script.js"></script>
</body>
</html>
