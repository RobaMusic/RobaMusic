<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RobaMusic</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="./assets/favicon.png">
</head>
<body>

    <div class="game-container" id="splashScreen">
        <div class="logo">
            <img src="./assets/roba_music_logo.png" alt="RobaMusic Logo">
        </div>
        <button class="spotify-connect-button" id="spotifyConnectBtn">
            <img src="./assets/spotify_icon.png" alt="Spotify Icon"> SPOTIFY CSATLAKOZTATÁSA
        </button>
        <p class="spotify-status" id="spotifyStatus">Spotify nincs csatlakoztatva</p>
        <button class="start-game-button" id="startGameBtn" disabled>
            <img src="./assets/play_icon.png" alt="Play Icon"> JÁTÉK INDÍTÁSA
        </button>
    </div>

    <!-- MAIN MENU SCREEN -->
    <div class="game-container hidden" id="mainMenuScreen">
        <div class="logo">
            <img src="./assets/roba_music_logo.png" alt="RobaMusic Logo">
        </div>
        <h2 class="screen-title">Játéktípus kiválasztása</h2>

        <button class="menu-button" id="qrScanBtn">
            QR-kód olvasás <br> <span class="subtitle">(Van saját kódcsomagod)</span>
        </button>
        <button class="menu-button" id="phoneGameBtn">
            Telefonos játék <br> <span class="subtitle">(QR-kód olvasás nélkül)</span>
        </button>
        <button class="menu-button" id="resultsBtn">
            Eredmények
        </button>
    </div>
    <!-- END MAIN MENU SCREEN -->


    <script src="script.js"></script>
</body>
</html>
