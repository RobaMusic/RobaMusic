<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RobaMusic</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/robadam88/RobaMusic/main/assets/favicon.png">
</head>
<body>

    <div class="game-container" id="splashScreen">
        <div class="logo">
            <img src="https://raw.githubusercontent.com/robadam88/RobaMusic/main/assets/logo.png" alt="RobaMusic Logo">
            <h1>ROBA MUSIC</h1>
            <h2>Találd ki a dalt!</h2>
        </div>
        <button class="spotify-connect-button" id="spotifyConnectBtn">
            <img src="https://raw.githubusercontent.com/robadam88/RobaMusic/main/assets/spotify_icon.png" alt="Spotify Icon"> SPOTIFY CSATLAKOZTATÁSA
        </button>
        <p class="spotify-status" id="spotifyStatus">Spotify nincs csatlakoztatva</p>
        <button class="start-game-button" id="startGameBtn" disabled>
            <img src="https://raw.githubusercontent.com/robadam88/RobaMusic/main/assets/play_icon.png" alt="Play Icon"> JÁTÉK INDÍTÁSA
        </button>
    </div>

    <!-- Ide jönnek majd a többi képernyő (Main Menu, QR Scan, etc.) -->

    <script src="script.js"></script>
</body>
</html>
